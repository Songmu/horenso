name: release
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'tag'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-build.yaml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: download release artifacts
      uses: actions/download-artifact@v8.0.2
      with:
        name: release-${{ github.ref_name }}
        path: release
    - name: setup godzil
      uses: Songmu/godzil@v0.23.2
    - name: prepare release notes
      id: notes
      run: |
        notes="$(godzil changelog --latest -F markdown)"
        delimiter="$(uuidgen)"
        {
          echo "body<<$delimiter"
          echo "$notes"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
    - name: publish GitHub release
      uses: tcnksm/ghr@v0.18.5
      with:
        owner: ${{ github.repository_owner }}
        repository: ${{ github.event.repository.name }}
        tag: ${{ github.ref_name }}
        token: ${{ github.token }}
        path: release
        body: ${{ steps.notes.outputs.body }}
        replace: "true"
